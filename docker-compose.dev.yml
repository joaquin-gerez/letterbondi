services:
  app:
    build:
      context: .
      target: build
    command: npm run dev
    environment:
      NODE_ENV: development
      COOKIE_SECURE: "false"
      VITE_HOST: 0.0.0.0
      VITE_USE_POLLING: "true"
    ports:
      - "3000:3000"
      - "5173:5173"
    volumes:
      - .:/app
      - letterbondi_node_modules:/app/node_modules
      - letterbondi_data:/app/data

volumes:
  letterbondi_node_modules:
