name: letterbondi

services:
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      edge:
      backend:
        ipv4_address: 172.28.250.2
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 100

  app:
    image: letterbondi:prod
    build:
      context: .
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: file:/app/data/letterbondi.db
      COOKIE_SECURE: "true"
      ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN is required}
      PUBLIC_ORIGIN: https://${DOMAIN:?DOMAIN is required}
      TRUST_PROXY_IP: 172.28.250.2
    volumes:
      - letterbondi_data:/app/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    init: true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 100
    stop_grace_period: 30s

networks:
  edge:
  backend:
    internal: true
    ipam:
      config:
        - subnet: 172.28.250.0/24

volumes:
  letterbondi_data:
  caddy_data:
  caddy_config:
